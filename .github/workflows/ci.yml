name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_tests:
        description: Run tests
        type: boolean
        default: false

# Each per-stack job only runs when its dir changed (or the workflow
# itself). Without this, a Ruby-only PR triggers the R job too and one
# transient R-setup blip turns the PR red — driving the fabrik worker
# into a re-cycle on something it didn't break.

jobs:
  changes:
    if: ${{ inputs.run_tests }}
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
      r: ${{ steps.filter.outputs.r }}
      rust: ${{ steps.filter.outputs.rust }}
      dotnet: ${{ steps.filter.outputs.dotnet }}
      ruby: ${{ steps.filter.outputs.ruby }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            workflow: ['.github/workflows/**']
            go: ['go/**', '.github/workflows/**']
            r: ['r/**', '.github/workflows/**']
            rust: ['rust/**', '.github/workflows/**']
            dotnet: ['dotnet/**', '.github/workflows/**']
            ruby: ['ruby/**', '.github/workflows/**']

  go:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: go test ./...

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --quiet

  r:
    needs: changes
    if: needs.changes.outputs.r == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: r
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r
          extra-packages: any::testthat
      # `testthat::test_dir` runs in a bare R session — the package source
      # is on disk but its functions aren't on the search path, so every
      # test fails with "could not find function". Use `pkgload::load_all`
      # to attach the source like `devtools::load_all` would, matching the
      # `tests/testthat.R` entry point's `library(flt.calc)` semantics
      # without the install step.
      - run: Rscript -e 'pkgload::load_all("."); testthat::test_dir("tests/testthat", stop_on_failure = TRUE)'

  dotnet:
    needs: changes
    if: needs.changes.outputs.dotnet == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dotnet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet test --nologo

  ruby:
    needs: changes
    if: needs.changes.outputs.ruby == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ruby
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: ruby
      - run: bundle exec rspec
